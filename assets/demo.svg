<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .header { fill: #161b22; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; text-anchor: middle; }
      .code { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; font-size: 13px; fill: #c9d1d9; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0f6fc; font-weight: bold; }
      .ok { fill: #3fb950; font-weight: bold; }
      .cyan { fill: #79c0ff; }
      .yellow { fill: #d29922; }
      .muted { fill: #8b949e; }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="878" height="428" rx="10" ry="10"/>
  <path class="header" d="M 1 11 Q 1 1 11 1 L 869 1 Q 879 1 879 11 L 879 36 L 1 36 Z"/>
  <line x1="1" y1="36" x2="879" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  <text class="title" x="440" y="22">jitpipe — JIT-Compiled Semantic Unix Pipes (sgrep, sawk, sjq)</text>

  <text class="code" x="24" y="66"><tspan class="muted"># 1. sgrep: Sample 25 rows -&gt; synthesize native Regex -&gt; stream millions of lines with zero allocations</tspan></text>
  <text class="code" x="24" y="86"><tspan class="prompt">$</tspan> <tspan class="cmd">cat access.log | sgrep -n --explain "5xx server errors" | head -n 3</tspan></text>
  <text class="code" x="24" y="106"><tspan class="muted">[jitpipe:sgrep] Query: "5xx server errors" -&gt; Synthesized: Regex("\\b5\\d{2}\\b") on 25-row sample</tspan></text>
  <text class="code" x="24" y="126"><tspan class="cyan">250:</tspan>2026-11-16T12:00:01Z req_id=req_0250 status=<tspan class="yellow">503</tspan> latency_ms=1420</text>
  <text class="code" x="24" y="144"><tspan class="cyan">500:</tspan>2026-11-16T12:00:02Z req_id=req_0500 status=<tspan class="yellow">502</tspan> latency_ms=980</text>
  <text class="code" x="24" y="162"><tspan class="cyan">750:</tspan>2026-11-16T12:00:04Z req_id=req_0750 status=<tspan class="yellow">503</tspan> latency_ms=1610</text>

  <text class="code" x="24" y="198"><tspan class="muted"># 2. sawk: Automatic delimiter detection + conditional field projection</tspan></text>
  <text class="code" x="24" y="218"><tspan class="prompt">$</tspan> <tspan class="cmd">cat latency.csv | sawk '$3 &gt; 500 {print $1, $3}'</tspan></text>
  <text class="code" x="24" y="238">checkout-api    842</text>
  <text class="code" x="24" y="256">billing-worker  1205</text>

  <text class="code" x="24" y="292"><tspan class="muted"># 3. sjq: JSONL object projection &amp; numeric predicate filtering at native Rust speed</tspan></text>
  <text class="code" x="24" y="312"><tspan class="prompt">$</tspan> <tspan class="cmd">cat events.jsonl | sjq -c '{user_id, service} where latency_ms &gt; 500'</tspan></text>
  <text class="code" x="24" y="332"><tspan class="ok">{"service":"billing","user_id":"u2"}</tspan></text>
  <text class="code" x="24" y="350"><tspan class="ok">{"service":"search","user_id":"u3"}</tspan></text>

  <text class="code" x="24" y="386"><tspan class="muted"># 4. Cache compiled filter to disk for 0ms startup in production cron/CI pipelines</tspan></text>
  <text class="code" x="24" y="406"><tspan class="prompt">$</tspan> <tspan class="cmd">cat prod.log | sgrep --load-filter .jitpipe/5xx_filter.json</tspan></text>
</svg>
