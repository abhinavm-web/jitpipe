[package]
name = "jitpipe"
version = "0.1.1"
edition = "2021"
description = "JIT-compiled semantic Unix pipe utilities (sgrep, sawk, sjq)"
authors = ["Abhinav Mahajan <abhinavmahajan91@gmail.com>"]
repository = "https://github.com/abhinavm-web/jitpipe"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[[bin]]
name = "jitpipe"
path = "src/main.rs"

[[bin]]
name = "sgrep"
path = "src/bin/sgrep.rs"

[[bin]]
name = "sawk"
path = "src/bin/sawk.rs"

[[bin]]
name = "sjq"
path = "src/bin/sjq.rs"

[lib]
name = "jitpipe"
path = "src/lib.rs"
